<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!-- The code is in the query string: never leak it through Referer. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>xTang 授权回传</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font: 15px/1.6 ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
        background: #f4f8fe; color: #0b1f44;
      }
      main { width: min(560px, 92vw); padding: 28px 30px; background: #fff; border-radius: 14px;
             box-shadow: 0 10px 40px rgba(11, 63, 158, .12); border: 1px solid #dce6f5; }
      h1 { font-size: 19px; margin: 0 0 8px; }
      p { margin: 10px 0; color: #5b6b86; font-size: 13px; }
      a.btn { display: inline-block; margin: 8px 0 12px; padding: 9px 18px; border-radius: 8px;
              background: linear-gradient(135deg, #22c1f5, #0b6be0); color: #fff; text-decoration: none;
              font-weight: 600; font-size: 14px; }
      pre { margin: 0; padding: 10px 12px; background: #f4f8fe; border: 1px solid #dce6f5;
            border-radius: 8px; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
      .err { color: #c0261a; font-weight: 600; }
      button { margin-top: 10px; padding: 7px 14px; border-radius: 8px; border: 1px solid #dce6f5;
               background: #fff; color: #0b1f44; cursor: pointer; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <h1>正在返回 xTang 工作台…</h1>
      <p id="hint">如果 2 秒后没有自动跳转，请点下面的按钮；仍然不行就把链接复制回工作台。</p>
      <p id="error" class="err" hidden></p>
      <a id="go" class="btn" href="#">返回工作台</a>
      <pre id="url"></pre>
      <button id="copy" type="button">复制链接</button>
    </main>

    <script>
      // Fixed loopback target: this page never accepts a destination from the
      // query string, so it cannot be used as an open redirect.
      var TARGET = 'http://127.0.0.1:17890/oauth/callback'
      var query = location.search || ''
      var fragment = location.hash || ''
      var url = TARGET + query + fragment

      var error = new URLSearchParams(query).get('error')
      if (error) {
        var box = document.getElementById('error')
        box.textContent = '平台返回了错误：' + error
        box.hidden = false
        document.getElementById('hint').textContent =
          '授权没有完成。可以回到工作台重试，或把下面的链接连同错误信息发给我们。'
      }

      document.getElementById('url').textContent = url
      document.getElementById('go').href = url

      document.getElementById('copy').addEventListener('click', function () {
        var done = function () {
          var b = document.getElementById('copy')
          b.textContent = '已复制'
          setTimeout(function () { b.textContent = '复制链接' }, 1500)
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(done, done)
        } else {
          var pre = document.getElementById('url')
          var range = document.createRange()
          range.selectNodeContents(pre)
          var sel = window.getSelection()
          sel.removeAllRanges()
          sel.addRange(range)
          done()
        }
      })

      // Give the page one paint before handing over to the local listener.
      setTimeout(function () { location.replace(url) }, 900)
    </script>
  </body>
</html>
